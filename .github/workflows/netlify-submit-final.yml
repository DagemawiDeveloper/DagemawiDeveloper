name: Final portfolio submission audit deploy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/netlify-submit-final.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild portfolio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          base="https://raw.githubusercontent.com/DagemawiDeveloper/DagemawiDeveloper/c50a72b38b3ccfbb40c3f1e7e9af13fb056e739b/deploy"
          for n in 0 1 2 3; do
            curl -fsSL "$base/portfolio.part${n}.b64" >> deploy/portfolio.b64
          done
          base64 --decode deploy/portfolio.b64 > deploy/portfolio.zip
          mkdir -p deploy/site
          unzip -q deploy/portfolio.zip -d deploy/site
          test -f deploy/site/index.html
          test -f deploy/site/resume.html

      - name: Apply final evidence and link fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path('deploy/site')
          index = site / 'index.html'
          s = index.read_text()

          # Dagu is private source. The architecture repo is documentation only.
          dagu_link = re.compile(r'<a class="text-link" href="https://github\.com/DagemawiDeveloper/saas-architecture-showcase"[^>]*>.*?</a>', re.S)
          replacement = '''<p class="project-note"><strong>Source:</strong> Dagu is a private commercial codebase. The public GitHub link below contains sanitized architecture documentation and ADRs only — not Dagu application source.</p>\n            <a class="text-link" href="https://github.com/DagemawiDeveloper/saas-architecture-showcase" target="_blank" rel="noreferrer">Read architecture notes (documentation only) <img src="assets/icons/arrow.svg" alt=""></a>'''
          if dagu_link.search(s):
              s = dagu_link.sub(replacement, s, count=1)
          elif 'not Dagu application source' not in s:
              raise SystemExit('Could not locate Dagu architecture link')

          # Keep My Health Hub as real client WordPress work, but never link to the unavailable site.
          s = s.replace('PRODUCTION CLIENT WORK', 'CLIENT WORDPRESS PROJECT')
          s = re.sub(r'\s*<a class="text-link" href="https?://(?:www\.)?myhealth[^\"]*"[^>]*>.*?</a>', '', s, flags=re.S | re.I)

          # The submitted CV is uploaded directly to the application. Avoid exposing an older downloadable CV.
          s = s.replace('href="assets/Dagemawi_Alemayehu_Resume.pdf" download', 'href="resume.html"')
          s = s.replace('href="assets/Dagemawi_Alemayehu_Resume.docx" download', 'href="resume.html"')
          s = s.replace('Download résumé', 'View résumé')
          s = s.replace('PDF · polished two-page layout', 'Web résumé · selected engineering evidence')
          s = s.replace('Download editable DOCX', 'Open web résumé')
          index.write_text(s)

          css = site / 'styles.css'
          if css.exists():
              c = css.read_text()
              if '.project-note{' not in c:
                  c += '\n.project-note{margin:0 0 18px;padding:13px 14px;border-left:3px solid var(--teal);border-radius:0 10px 10px 0;background:rgba(20,125,146,.07);font-size:13px;line-height:1.55;color:var(--muted)}.project-note strong{color:var(--navy)}\n'
                  css.write_text(c)

          resume = site / 'resume.html'
          r = resume.read_text()
          r = r.replace('Lead Product Engineer · Private commercial product', 'Lead Product Engineer · Private commercial product · source code private')
          r = r.replace('WordPress directory and data platform · Production client work', 'WordPress directory and data platform · Client project')
          r = re.sub(r'\s*<a[^>]+href="https?://(?:www\.)?myhealth[^\"]*"[^>]*>.*?</a>', '', r, flags=re.S | re.I)
          resume.write_text(r)

          # Remove stale downloadable files so a reviewer cannot land on an older CV by accident.
          for name in ['Dagemawi_Alemayehu_Resume.pdf', 'Dagemawi_Alemayehu_Resume.docx']:
              p = site / 'assets' / name
              if p.exists():
                  p.unlink()

          final = index.read_text()
          assert 'not Dagu application source' in final
          assert 'Read architecture notes (documentation only)' in final
          assert not re.search(r'href="https?://(?:www\.)?myhealth', final, re.I)
          assert 'assets/Dagemawi_Alemayehu_Resume.pdf' not in final
          assert 'assets/Dagemawi_Alemayehu_Resume.docx' not in final
          assert final.count('href="resume.html"') >= 3
          PY

      - name: Deploy to existing Netlify site
        working-directory: deploy/site
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 0f6c9787-1846-48bd-9703-663ac842637d
          --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..oIQlKnOqbCHfU35O.eSh3HbEWCqBEyq_mL93VWvpWy9KbGJE1j9k45wGsdPbILTpj5L25AO1L9Ntr6Wgh1JOVs7v27MhXgOcdbP65XID6-Jr9zLl7VbOp-UncheV0X1R-1WDkldgjK2f0g_a7vmQ-dhvsZ7aOsUi0XJmsny1XWcpblrp0MAilk2f2zNN7ws7yzASeQ05TYdIV32Q2P-shjTZAMI34I8-V8LgxD9CS5-3tFkSObrCKGG30Gy7tPc-zqo4jioMAtXWFHJNidM28mth1sNjwEMzPDaxxbhxb5BsHd5p8DSU9q834JXB2KfWz54cgOvYnoJLy951wXWFYqyYIJHaQSx3XpTv0NgoWNRe0m12W24O5CGzhK5TNtu1sQ55hWwiHrjCbhofR18DGq4rk.OwOMFUQIlGuY0QrCJ_8EwQ"
